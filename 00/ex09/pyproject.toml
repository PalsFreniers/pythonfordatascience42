[build-system]
requires = ['setuptools>=77.0.3']
build-backend = 'setuptools.build_meta'

[project]
name = "ft_package"
version = "1.0.0"
authors = [
  { name="PalsFreniers", email="tdelage@student.42angouleme.fr" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/PalsFreniers/pythonfordatascience42/tree/matser/00/ex09/ft_package"
